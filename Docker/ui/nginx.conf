server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # PDF.js loads its worker as an ES module.
    location ~* \.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
    }

    # The signed Send to Noted Shortcut template. iOS recognises the .shortcut
    # extension; there is no registered MIME type. An add_header here replaces
    # the server-level headers, so the two security headers are repeated.
    location = /send-to-noted.shortcut {
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="Send to Noted.shortcut"';
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
