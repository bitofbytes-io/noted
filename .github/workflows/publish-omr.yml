name: Publish OMR worker

on:
  push:
    branches: [main]
    paths:
      - 'omr/**'
      - 'cmd/omr-worker/**'
      - 'internal/omrworker/**'
      - 'internal/omrreport/**'
      - 'testdata/fixtures/noted-exercise.musicxml'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/publish-omr.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish AMD64 worker
    runs-on: ubuntu-latest
    environment:
      name: crystal1
    env:
      IMAGE_REG: ${{ vars.IMAGE_REG }}
      IMAGE_REPO: ${{ vars.IMAGE_REPO }}
      OMR_IMAGE_REPO: ${{ format('{0}-omr', vars.IMAGE_REPO) }}
      OMR_PLATFORMS: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Derive image tag
        id: meta
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate registry configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${IMAGE_REG:?Missing crystal1 variable IMAGE_REG}"
          : "${IMAGE_REPO:?Missing repository variable IMAGE_REPO}"

      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REG }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and publish OMR worker
        env:
          REGISTRY: ${{ env.IMAGE_REG }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.tag }}
          REVISION: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: make docker-buildx-omr
