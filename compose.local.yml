services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: noted
      POSTGRES_USER: noted
      POSTGRES_PASSWORD: noted
    ports:
      - "5434:5432"
    volumes:
      - noted-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noted -d noted"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  noted-postgres:
